[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metamorphic-ml-tests"
version = "0.1.0"
description = "Pilot project to practice metamorphic testing on MNIST"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "Pillow>=10,<12",
  "PyYAML>=6,<7",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "matplotlib>=3.8,<4"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "models*"]
